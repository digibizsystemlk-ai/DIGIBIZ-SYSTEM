    <style>
        :root {
            --bg: #f8fafc;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --royal: #1e40af;
            --primary: #2563eb;
            --danger: #dc2626;

        }

        body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 60px; padding-top: 0 !important; }

        #digibizMobileTopbar, #digibizMobileMenuToggle { display: none !important; }

        .app-container { max-width: 600px; margin: 0 auto; padding: 8px 12px 24px 12px; }

        /* 2-LINE UNIFIED TOP HEADER */
        .unified-header-card {
            background: #ffffff;
            border: 1.5px solid var(--border);
            border-radius: 14px;
            padding: 8px 12px;
            box-shadow: 0 3px 10px rgba(15, 23, 42, 0.04);
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .hdr-line-1 {
            display: flex;

        }

        .hdr-left {
            display: flex;
            align-items: center;

        }

        .btn-hdr {

            height: 32px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #f8fafc;
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s;
        }

        .btn-hdr:active { background: #e2e8f0; transform: scale(0.95); }

        .app-title-wrap { display: flex; align-items: center; gap: 6px; }
        .app-title-wrap h1 { font-size: 14.5px; font-weight: 900; color: var(--royal); margin: 0; line-height: 1; }

        .status-dot {
            width: 7.5px;
            height: 7.5px;
            border-radius: 50%;
            background-color: var(--success);
            box-shadow: 0 0 7px var(--success);
        }

        .hdr-line-2 {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 4px 9px;
            border-radius: 8px;
            text-decoration: none;
        }

        .hdr-owner-name { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; color: var(--royal); }
        .hdr-owner-name i { color: #f59e0b; font-size: 10.5px; }

        .hdr-owner-badge {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: var(--royal);

            font-weight: 800;

            border-radius: 6px;
        }

        .pwd-card {
            background: #ffffff;
            border: 1.5px solid var(--border);
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }

        .form-group { margin-bottom: 14px; text-align: left; }
        .form-group label { display: block; font-size: 11px; font-weight: 800; text-transform: uppercase; color: #475569; letter-spacing: 0.3px; margin-bottom: 5px; }
        .form-control { width: 100%; padding: 11px 13px; border: 1.5px solid var(--border); border-radius: 9px; font-size: 13.5px; outline: none; }
        .form-control:focus { border-color: var(--primary); }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--royal) 0%, var(--primary) 100%);
            color: #ffffff;
            border: none;
            border-radius: 11px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 10px;
        }
        /* Access Denied Overlay */
        #accessDeniedScreen {
            display: none;

            inset: 0;
            background: #0f172a;
            color: #ffffff;
            z-index: 10000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        .denied-card {
            background: #1e293b;
            border: 2px solid #ef4444;
            border-radius: 20px;
            padding: 28px 24px;
            max-width: 440px;

        .denied-card p { font-size: 13px; color: #94a3b8; margin-bottom: 16px; line-height: 1.4; }

<body class="credit-app-body">

    <!-- ACCESS DENIED SCREEN -->
    <div id="accessDeniedScreen">
        <div class="denied-card">
            <i class="fa-solid fa-ban denied-icon"></i>
            <h2>Access Denied</h2>
            <p>You do not have permission to access the <strong>DARSHANA MADAWALA</strong> workspace with account: <br><span id="deniedEmail" style="color:#38bdf8; font-weight:bold;"></span></p>
            <p style="font-size: 11.5px; color: #cbd5e1;">Please log in with an authorized account.</p>
            <button class="btn-switch-account" onclick="handleDeniedLogout()">
                <i class="fa-solid fa-right-from-bracket"></i> Switch Account / Log Out
            </button>
        </div>
    </div>

    <div class="app-container">
        
        <!-- 2-LINE UNIFIED TOP HEADER -->
        <header class="unified-header-card">
            <div class="hdr-line-1">
                <div class="hdr-left">
                    <button type="button" class="btn-hdr" onclick="toggleSidebarMenu()" aria-label="Menu">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <a href="/clients/madawalateashop/modules/credit/dashboard.html?v=20260823_owner_v135" class="btn-hdr" title="Home Dashboard">
                        <i class="fa-solid fa-house"></i>
                    </a>
                    <div class="app-title-wrap">
                        <h1>CHANGE PASSWORD</h1>
                        <span class="status-dot" id="networkStatusDot" title="Online"></span>
                    </div>
                </div>
            </div>

            <a href="/clients/madawalateashop/modules/credit/profile.html" class="hdr-line-2" title="Business Profile">
                <div class="hdr-owner-name">
                    <i class="fa-solid fa-crown"></i>
                    <span id="topOwnerName">DARSHANA MADAWALA</span>
                </div>
                <span class="hdr-owner-badge">SECURITY</span>
            </a>
        </header>

        <div class="pwd-card">
            <form id="changePasswordForm" onsubmit="handleChangePassword(event)">
                <div class="form-group">
                    <label>Current Password *</label>
                    <input type="password" class="form-control" id="currPwd" required placeholder="Enter current password">
                </div>

                <div class="form-group">
                    <label>New Password *</label>
                    <input type="password" class="form-control" id="newPwd" required minlength="6" placeholder="At least 6 characters">
                </div>

                <div class="form-group">
                    <label>Confirm New Password *</label>
                    <input type="password" class="form-control" id="confirmPwd" required minlength="6" placeholder="Repeat new password">
                </div>

                <button type="submit" class="btn-submit" id="btnSubmit">
                    <i class="fa-solid fa-key"></i> Update Password
                </button>
            </form>
        </div>

    </div>

    <script>
        function toggleSidebarMenu() {
            document.documentElement.classList.toggle('digibiz-sidebar-open');
        }

                // ACCESS CONTROL CHECK — Strictly Restricted to Owner & Super Admin
        function verifyDarshanaAccess(user) {
            if (!user) return false;
            const email = (user.email || '').toLowerCase().trim();
            const isImpersonating = localStorage.getItem('digibiz_impersonate_active') === 'true';
            
            const isAuthorized = email === 'darshanamadawala80@gmail.com' ||
                                 email.includes('darshanamadawala') || 
                                 email.includes('darshana') ||
                                 email === 'biz.sirimal@gmail.com' ||
                                 email === '2biz.sirimal@gmail.com' ||
                                 email === 'scrap@chinthaka.com' ||
                                 email.includes('superadmin') ||
                                 email.startsWith('chinthaka') ||
                                 (isImpersonating && (email.includes('admin') || email.includes('super') || email.includes('chinthaka')));
            
            if (!isAuthorized) {
                const deniedScreen = document.getElementById('accessDeniedScreen');
                if (deniedScreen) {
                    const deniedEmail = document.getElementById('deniedEmail');
                    if (deniedEmail) deniedEmail.textContent = user.email || 'Unknown User';
                    deniedScreen.style.display = 'flex';
                } else {
                    alert('Access Denied: You do not have permission to access Darshana Madawala Credit App.');
                    window.location.href = '/auth/login.html';
                }
                return false;
            }
            return true;
        }

        function handleDeniedLogout() {
            if (typeof firebase !== 'undefined' && firebase.auth) {
                firebase.auth().signOut().then(() => {
                    window.location.href = '/auth/login.html';
                });
            } else {
                window.location.href = '/auth/login.html';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (typeof firebase !== 'undefined' && firebase.auth) {
                firebase.auth().onAuthStateChanged((user) => {
                    if (!user) {
                    localStorage.removeItem('dm_auth_verified_email');
                    window.location.href = '/auth/login.html';
                    return;
                }
                if (!verifyDarshanaAccess(user)) return;
                localStorage.setItem('dm_auth_verified_email', user.email);
                localStorage.setItem('currentUserRole', 'BUSINESS_OWNER');
                localStorage.setItem('currentBusinessNavRole', 'BUSINESS_OWNER');
                localStorage.setItem('currentBusinessType', 'credit_ledger');
                localStorage.setItem('currentBusinessName', 'MADAWALA TEA SHOP');
                });
            }
        });

        async function handleChangePassword(e) {
            e.preventDefault();
            const curr = document.getElementById('currPwd').value;
            const newP = document.getElementById('newPwd').value;
            const conf = document.getElementById('confirmPwd').value;

            if (newP !== conf) {
                alert('New passwords do not match!');
                return;
            }

            const user = firebase.auth().currentUser;
            if (!user || !user.email) {
                alert('Not authenticated.');
                return;
            }

            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;

            try {
                const cred = firebase.auth.EmailAuthProvider.credential(user.email, curr);
                await user.reauthenticateWithCredential(cred);
                await user.updatePassword(newP);
                alert('Password updated successfully!');
                document.getElementById('changePasswordForm').reset();
            } catch(err) {
                alert('Error: ' + err.message);
            } finally {
                btn.disabled = false;
            }
        }
    </script>
    <script src="/clients/madawalateashop/modules/credit/ptr-helper.js?v=20260821_2030">
        window.toggleSidebarMenu = function() {
            document.documentElement.classList.toggle('digibiz-sidebar-open');
        };
        </script>

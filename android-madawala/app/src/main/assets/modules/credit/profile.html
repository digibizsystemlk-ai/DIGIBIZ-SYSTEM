    <style>
        html.digibiz-sidebar-reserved body { margin-left: 260px; }
        @media (max-width: 768px) { html.digibiz-sidebar-reserved body { margin-left: 0; } }

        :root {
            --bg: #f8fafc;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --tea-primary: #064e3b;
            --tea-emerald: #059669;
            --tea-gold: #f59e0b;
            --tea-accent: #10b981;
            --danger: #dc2626;
            --success: #16a34a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 60px; padding-top: 0 !important; }

        #digibizMobileTopbar, #digibizMobileMenuToggle { display: none !important; }

        .app-container { max-width: 580px; margin: 0 auto; padding: 12px 14px 28px 14px; }

        /* UNIFIED TOP HEADER */
        .unified-header-card {
            background: #ffffff;
            border: 1.5px solid var(--border);
            border-radius: 16px;
            padding: 10px 14px;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .hdr-line-1 {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .hdr-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-hdr {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #f8fafc;
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s;
        }

        .btn-hdr:active { background: #e2e8f0; transform: scale(0.95); }

        .app-title-wrap { display: flex; align-items: center; gap: 8px; }
        .app-title-wrap h1 { font-size: 14px; font-weight: 900; color: var(--tea-primary); margin: 0; line-height: 1; letter-spacing: 0.5px; }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--success);
            box-shadow: 0 0 8px var(--success);
        }

        .hdr-line-2 {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            padding: 6px 12px;
            border-radius: 10px;
            text-decoration: none;
        }

        .hdr-owner-name { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 800; color: var(--tea-primary); }
        .hdr-owner-name i { color: #f59e0b; font-size: 12px; }

        .hdr-owner-badge {
            background: #ffffff;
            border: 1px solid #86efac;
            color: #047857;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 6px;
            text-transform: uppercase;
        }

        /* TEA SHOP PROFILE HERO CARD */
        .profile-hero-card {
            background: linear-gradient(135deg, #064e3b 0%, #022c22 100%);
            border: 2px solid #f59e0b;
            border-radius: 20px;
            padding: 20px;
            color: #ffffff;
            margin-bottom: 16px;
            box-shadow: 0 10px 30px rgba(6, 78, 59, 0.25);
            display: flex;
            align-items: center;
            gap: 16px;
            position: relative;
            overflow: hidden;
        }

        .profile-hero-card::after {
            content: '🍵';
            position: absolute;
            right: -10px;
            bottom: -15px;
            font-size: 90px;
            opacity: 0.12;
            pointer-events: none;
        }

        .hero-avatar {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            background: #ffffff;
            border: 2px solid #f59e0b;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 4px 14px rgba(0,0,0,0.2);
        }

        .hero-avatar img { width: 44px; height: 44px; }

        .hero-details h2 { font-size: 17px; font-weight: 900; color: #fef3c7; margin-bottom: 3px; letter-spacing: 0.5px; }
        .hero-role { font-size: 12px; font-weight: 700; color: #34d399; display: flex; align-items: center; gap: 5px; }
        .hero-loc { font-size: 11px; font-weight: 600; color: #a7f3d0; margin-top: 4px; display: flex; align-items: center; gap: 4px; }

        /* FORM CARD */
        .card {
            background: #ffffff;
            border: 1.5px solid var(--border);
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.03);
            margin-bottom: 16px;
        }

        .card-header-line {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid #f1f5f9;
        }

        .card-header-line h3 { font-size: 14px; font-weight: 800; color: #0f172a; text-transform: uppercase; letter-spacing: 0.5px; }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 11.5px; font-weight: 800; text-transform: uppercase; color: #475569; letter-spacing: 0.4px; margin-bottom: 5px; }
        
        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrap i {
            position: absolute;
            left: 14px;
            color: #94a3b8;
            font-size: 14px;
        }

        .form-control {
            width: 100%;
            padding: 11px 14px 11px 40px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text);
            background: #ffffff;
            outline: none;
            transition: all 0.15s;
        }

        .form-control:focus {
            border-color: var(--tea-emerald);
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
        }

        .form-control[readonly] {
            background: #f8fafc;
            color: #64748b;
            cursor: not-allowed;
            border-style: dashed;
        }

        .btn-save {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #065f46 0%, #047857 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(6, 95, 70, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-save:active { transform: scale(0.98); }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #0f172a;
            color: #ffffff;
            padding: 11px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            font-size: 13px;
            font-weight: 700;
            display: none;
            z-index: 99999;
            align-items: center;
            gap: 8px;
            border: 1px solid #334155;
        }

        /* Access Denied Overlay (HIDDEN BY DEFAULT) */
        #accessDeniedScreen {
            display: none !important;
        }
    </style>
</head>
<body class="credit-app-body">

    <div class="app-container">
        
        <!-- UNIFIED TOP HEADER -->
        <header class="unified-header-card">
            <div class="hdr-line-1">
                <div class="hdr-left">
                    <button type="button" class="btn-hdr" onclick="window.toggleSidebarMenu()" aria-label="Open Sidebar Menu">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <a href="/clients/madawalateashop/modules/credit/dashboard.html?v=20260823_owner_v135" class="btn-hdr" title="Home Dashboard">
                        <i class="fa-solid fa-house"></i>
                    </a>
                    <div class="app-title-wrap">
                        <h1>BUSINESS PROFILE & OWNER</h1>
                        <span class="status-dot" id="networkStatusDot" title="Online"></span>
                    </div>
                </div>
            </div>
            
            <div class="hdr-line-2">
                <div class="hdr-owner-name">
                    <i class="fa-solid fa-crown"></i>
                    <span id="hdrBizName">MADAWALA TEA SHOP</span>
                </div>
                <span class="hdr-owner-badge">PROFILE</span>
            </div>
        </header>

        <!-- PROFILE HERO CARD -->
        <div class="profile-hero-card">
            <div class="hero-avatar">
                <img src="/clients/madawalateashop/assets/icon-192.svg" alt="Madawala Tea Shop">
            </div>
            <div class="hero-details">
                <h2 id="heroBizTitle">MADAWALA TEA SHOP</h2>
                <div class="hero-role"><i class="fa-solid fa-circle-check"></i> Primary Business Owner</div>
                <div class="hero-loc"><i class="fa-solid fa-location-dot"></i> <span id="heroLocation">Kurunegala, Sri Lanka</span></div>
            </div>
        </div>

        <!-- PROFILE FORM -->
        <div class="card">
            <div class="card-header-line">
                <i class="fa-solid fa-sliders" style="color:#059669;"></i>
                <h3>Business & Contact Information</h3>
            </div>

            <form id="profileForm" onsubmit="handleSaveProfile(event)">
                <div class="form-group">
                    <label>Business / Store Name *</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-store"></i>
                        <input type="text" class="form-control" id="bizName" value="MADAWALA TEA SHOP" required placeholder="e.g. MADAWALA TEA SHOP">
                    </div>
                </div>

                <div class="form-group">
                    <label>Contact Person / Full Name *</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-user-tie"></i>
                        <input type="text" class="form-control" id="contactPerson" value="DARSHANA MADAWALA" required placeholder="e.g. DARSHANA MADAWALA">
                    </div>
                </div>

                <div class="form-group">
                    <label>Contact Phone Number *</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-phone"></i>
                        <input type="tel" class="form-control" id="contactPhone" value="0778933264" required placeholder="e.g. 0778933264">
                    </div>
                </div>

                <div class="form-group">
                    <label>Business Address / City *</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-map-location-dot"></i>
                        <input type="text" class="form-control" id="bizAddress" value="KURUNEGALA" required placeholder="e.g. KURUNEGALA">
                    </div>
                </div>

                <div class="form-group">
                    <label>Account Login Email (Read Only)</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" class="form-control" id="loginEmail" value="darshanamadawala80@gmail.com" readonly>
                    </div>
                </div>

                <button type="submit" class="btn-save" id="btnSave">
                    <i class="fa-solid fa-floppy-disk"></i>
                    <span>Save Profile Details</span>
                </button>
            </form>
        </div>

    </div>

    <!-- TOAST -->
    <div id="profileToast" class="toast">
        <i class="fa-solid fa-circle-check" style="color:#34d399;"></i>
        <span id="toastMsg">Profile updated successfully!</span>
    </div>

    <script>
        // Sidebar Toggle Helper
        window.toggleSidebarMenu = function() {
            document.documentElement.classList.toggle('digibiz-sidebar-open');
        };

        const db = firebase.firestore();
        let currentUid = '';
        let currentBizId = '';

        function showToast(msg) {
            const toast = document.getElementById('profileToast');
            const toastMsg = document.getElementById('toastMsg');
            if (toastMsg) toastMsg.textContent = msg;
            if (toast) {
                toast.style.display = 'flex';
                setTimeout(() => { toast.style.display = 'none'; }, 3500);
            }
        }

        async function loadProfileData(user) {
            if (!user) return;
            currentUid = user.uid;
            document.getElementById('loginEmail').value = user.email || 'darshanamadawala80@gmail.com';

            try {
                // 1. Check users collection
                const uSnap = await db.collection('users').doc(currentUid).get().catch(() => null);
                const uData = uSnap && uSnap.exists ? uSnap.data() : {};
                currentBizId = uData.businessId || localStorage.getItem('currentBusinessId') || currentUid;

                // 2. Check businesses collection
                let bData = {};
                if (currentBizId) {
                    const bSnap = await db.collection('businesses').doc(currentBizId).get().catch(() => null);
                    if (bSnap && bSnap.exists) bData = bSnap.data();
                }

                // Populate Fields with defaults
                const bizTitle = bData.businessName || bData.name || uData.businessName || 'MADAWALA TEA SHOP';
                const owner = bData.contactPerson || bData.ownerName || uData.fullName || uData.name || 'DARSHANA MADAWALA';
                const phone = bData.phone || bData.contactPhone || uData.phone || '0778933264';
                const address = bData.address || bData.city || uData.address || 'KURUNEGALA';

                document.getElementById('bizName').value = bizTitle;
                document.getElementById('contactPerson').value = owner;
                document.getElementById('contactPhone').value = phone;
                document.getElementById('bizAddress').value = address;

                document.getElementById('hdrBizName').textContent = bizTitle;
                document.getElementById('heroBizTitle').textContent = bizTitle;
                document.getElementById('heroLocation').textContent = address + ', Sri Lanka';

            } catch (err) {
                console.error('[Profile Load Error]', err);
            }
        }

        async function handleSaveProfile(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSave');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';

            const bizName = document.getElementById('bizName').value.trim();
            const contactPerson = document.getElementById('contactPerson').value.trim();
            const contactPhone = document.getElementById('contactPhone').value.trim();
            const bizAddress = document.getElementById('bizAddress').value.trim();

            try {
                const patch = {
                    businessName: bizName,
                    name: bizName,
                    contactPerson: contactPerson,
                    ownerName: contactPerson,
                    phone: contactPhone,
                    contactPhone: contactPhone,
                    address: bizAddress,
                    city: bizAddress,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                };

                if (currentBizId) {
                    await db.collection('businesses').doc(currentBizId).set(patch, { merge: true });
                }
                if (currentUid) {
                    await db.collection('users').doc(currentUid).set(patch, { merge: true });
                }

                document.getElementById('hdrBizName').textContent = bizName;
                document.getElementById('heroBizTitle').textContent = bizName;
                document.getElementById('heroLocation').textContent = bizAddress + ', Sri Lanka';

                showToast('✅ Profile updated successfully!');
            } catch (err) {
                console.error('[Profile Save Error]', err);
                alert('Failed to save profile: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> <span>Save Profile Details</span>';
            }
        }

                function verifyDarshanaAccess(user) {
            if (!user) return false;
            const email = (user.email || '').toLowerCase().trim();
            const isImpersonating = localStorage.getItem('digibiz_impersonate_active') === 'true';
            
            const isAuthorized = email === 'darshanamadawala80@gmail.com' ||
                                 email.includes('darshanamadawala') || 
                                 email.includes('darshana') ||
                                 email === 'biz.sirimal@gmail.com' ||
                                 email === '2biz.sirimal@gmail.com' ||
                                 email === 'scrap@chinthaka.com' ||
                                 email.includes('superadmin') ||
                                 email.startsWith('chinthaka') ||
                                 (isImpersonating && (email.includes('admin') || email.includes('super') || email.includes('chinthaka')));
            
            if (!isAuthorized) {
                alert('Access Denied: You do not have permission to access Darshana Madawala Credit App.');
                window.location.href = '/auth/login.html';
                return false;
            }
            return true;
        }

        firebase.auth().onAuthStateChanged(user => {
            if (!user) {
                localStorage.removeItem('dm_auth_verified_email');
                window.location.href = '/auth/login.html';
                return;
            }
            if (!verifyDarshanaAccess(user)) return;
            localStorage.setItem('dm_auth_verified_email', user.email);
            localStorage.setItem('currentUserRole', 'BUSINESS_OWNER');
            localStorage.setItem('currentBusinessNavRole', 'BUSINESS_OWNER');
            localStorage.setItem('currentBusinessType', 'credit_ledger');
            localStorage.setItem('currentBusinessName', 'MADAWALA TEA SHOP');
            loadProfileData(user);
        });
    </script>
</body>
</html>

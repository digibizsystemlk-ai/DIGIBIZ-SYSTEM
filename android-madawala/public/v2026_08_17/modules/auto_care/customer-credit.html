<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="/v2026_08_17/core/pwa-init.js?v=1"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Credit & Receivables - DIGIBIZ Auto Care</title>
    <style>html.digibiz-sidebar-reserved body{margin-left:260px;}@media (max-width:768px){html.digibiz-sidebar-reserved body{margin-left:0;}}</style>
    <script>document.documentElement.classList.add('digibiz-sidebar-reserved');</script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="autocare-theme.css?v=3">
    
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>
    
    <script src="/v2026_08_17/core/firebase-init.js?v=100"></script>
    <script src="/v2026_08_17/scripts/admin-impersonation.js?v=100"></script>
    <script src="/v2026_08_17/core/event-validation.js?v=3"></script>
    <script src="/v2026_08_17/core/event-bus.js?v=3"></script>
    <script src="/v2026_08_17/core/accounts-core.js?v=3"></script>
    <script src="/v2026_08_17/core/auth-roles.js?v=2265"></script>

    <script src="/v2026_08_17/core/dashboard-core.js?v=2265"></script>
    <script src="/v2026_08_17/core/subscription-manager.js?v=3"></script>
    <script src="/v2026_08_17/core/sidebar.js?v=2116"></script>
    <script src="autocare-utils.js?v=2"></script>
    
    <style>
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .search-card { background: rgba(30, 41, 59, 0.85); border-radius: 16px; padding: 20px; border: 1px solid #334155; margin-bottom: 25px; }
        .search-box { position: relative; width: 100%; }
        .search-box input { width: 100%; padding: 14px 14px 14px 44px; font-size: 16px !important; }
        .search-box i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #ef4444; font-size: 18px; }

        .credit-card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        .credit-card { background: #0f172a; border-radius: 18px; border: 1px solid #334155; padding: 22px; transition: all 0.2s; }
        .credit-card:hover { border-color: #ef4444; box-shadow: 0 4px 20px rgba(239, 68, 68, 0.2); }
    </style>
</head>
<body>

    <div class="header-bar">
        <div>
            <h2 style="color:#ef4444; font-size:24px; font-weight:800;"><i class="fa-solid fa-credit-card"></i> Customer Credit & Debt Recognition Console</h2>
            <p style="color:#94a3b8; font-size:14px; margin-top:4px;">ණයට වාහන හදාගෙන යන පාරිභෝගිකයින්ගේ හිඟ මුදල් හඳුනා ගැනීම සහ ණය පියවීම් සටහන් කිරීම</p>
        </div>
    </div>

    <!-- Summary Stats -->
    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:20px; margin-bottom:25px;">
        <div class="card-dark" style="padding:20px;">
            <span style="font-size:13px; color:#94a3b8; font-weight:600;">Total Credit Debtors</span>
            <h2 style="font-size:26px; color:#ef4444; margin-top:6px;" id="statDebtorCount">0</h2>
        </div>
        <div class="card-dark" style="padding:20px;">
            <span style="font-size:13px; color:#94a3b8; font-weight:600;">Total Outstanding Receivables</span>
            <h2 style="font-size:26px; color:#f87171; margin-top:6px;" id="statTotalDebt">Rs. 0.00</h2>
        </div>
    </div>

    <!-- Search Engine Input -->
    <div class="search-card">
        <label style="font-size:13px; font-weight:700; color:#ef4444; margin-bottom:8px; display:block;">💳 Instant Credit Recognition Search (ණය හිමියන් සෙවීම)</label>
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="creditSearch" placeholder="Type Vehicle Reg Plate (e.g. CAB-8921), Customer Name or Phone Number..." onkeyup="renderCreditCards()">
        </div>
    </div>

    <!-- Credit Debtors Grid -->
    <div class="credit-card-grid" id="creditGrid">
        <!-- JS Rendered -->
    </div>

    <!-- Modal Collect Credit Payment -->
    <div class="modal" id="payModal" style="display:none;">
        <div class="modal-content" style="max-width:500px; padding:24px; border-radius:20px;">
            <h3 style="margin-bottom:15px; color:#34d399;"><i class="fa-solid fa-hand-holding-dollar"></i> Collect Credit Settlement Payment</h3>
            <form onsubmit="saveCreditPayment(event)">
                <input type="hidden" id="payCustId">
                <input type="hidden" id="payInvRef">
                <div style="display:flex; flex-direction:column; gap:12px;">
                    <div>
                        <label>Customer Name</label>
                        <input type="text" id="payCustName" readonly style="width:100%; font-weight:700; color:#ffffff;">
                    </div>
                    <div>
                        <label>Current Outstanding Debt (LKR)</label>
                        <input type="text" id="payCurrentDebt" readonly style="width:100%; font-weight:800; color:#ef4444;">
                    </div>
                    <div>
                        <label>Payment Settlement Date *</label>
                        <input type="date" id="payDate" required style="width:100%;">
                    </div>
                    <div>
                        <label>Amount Paid Now (LKR) *</label>
                        <input type="number" id="payAmount" required min="1" step="0.01" style="width:100%; font-size:18px; font-weight:800; color:#34d399;">
                    </div>
                    <div>
                        <label>Payment Method</label>
                        <select id="payMethod" style="width:100%;">
                            <option value="CASH">Cash</option>
                            <option value="CARD">Visa / Mastercard</option>
                            <option value="BANK">Bank Transfer / Online</option>
                        </select>
                    </div>
                    <div>
                        <label>Notes / Receipt Ref</label>
                        <input type="text" id="payNotes" placeholder="e.g. Paid by cheque #00912" style="width:100%;">
                    </div>
                </div>
                <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
                    <button type="button" class="btn btn-outline" onclick="document.getElementById('payModal').style.display='none'">Cancel</button>
                    <button type="submit" class="btn btn-primary" style="background:#10b981;">Collect & Settle Debt</button>
                </div>
            </form>
        </div>
    </div>

    <script>
                    const cust = custStr.trim();
                    if (!map[cust]) {
                        map[cust] = {
                            id: item.id,
                            name: cust,
                            ref: item.ref,
                            date: item.date,
                            debt: item.amount
                        };
                    } else {
                        map[cust].debt += item.amount;
                    }
                } else if (isSettlement) {
                    const custStr = item.desc ? item.desc.replace('Credit Settlement from', '').split('(')[0] : '';
                    const cust = custStr.trim();
                    if (map[cust]) {
                        map[cust].debt = Math.max(0, map[cust].debt - item.amount);
                    }
                }

            let totalDebtSum = 0;
            const filtered = creditRecords.filter(c => {
                const matchSearch = (c.name||'').toLowerCase().includes(search) || (c.reg||'').toLowerCase().includes(search) || (c.ref||'').toLowerCase().includes(search);
                return matchSearch && c.debt > 0;
            });

            creditRecords.forEach(c => { if(c.debt > 0) totalDebtSum += c.debt; });

            document.getElementById('statDebtorCount').innerText = filtered.length;
            document.getElementById('statTotalDebt').innerText = 'Rs. ' + totalDebtSum.toLocaleString('en-US', {minimumFractionDigits:2});

            if (filtered.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:40px; color:#64748b;">
                    <i class="fa-solid fa-circle-check" style="font-size:36px; color:#34d399; margin-bottom:10px; display:block;"></i>
                    <strong style="color:#ffffff;">ණය පාරිභෝගිකයින් කිසිවෙකු හමු නොවීය. (No active customer credit debt found)</strong>
                </div>`;
                return;
            }

            filtered.forEach(c => {
                const dateStr = window.AutoCareUtils ? window.AutoCareUtils.formatDateDDMMYYYY(c.date) : c.date;
                grid.innerHTML += `
                    <div class="credit-card">
                        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                            <div>
                                <strong style="font-size:16px; color:#ffffff;">${c.name}</strong>
                                <p style="font-size:13px; color:#38bdf8; margin-top:4px;"><i class="fa-solid fa-car"></i> Vehicle Reg: ${c.reg || 'N/A'}</p>
                            </div>
                            <span class="status-badge badge-pending">CREDIT DEBT</span>
                        </div>
                        <hr style="margin:12px 0; border-color:#334155;">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <div>
                                <small style="font-size:11px; color:#94a3b8;">Outstanding Debt Balance:</small>
                                <h3 style="font-size:22px; color:#ef4444; margin-top:2px;">Rs. ${c.debt.toLocaleString('en-US', {minimumFractionDigits:2})}</h3>
                            </div>
                            <button class="btn btn-primary" style="background:#10b981;" onclick="openPayModal('${c.id}')"><i class="fa-solid fa-hand-holding-dollar"></i> Collect Payment</button>
                        </div>
                        <div style="margin-top:10px; font-size:11px; color:#64748b;">
                            <span>Invoice Ref: <strong>${c.ref}</strong> | Debt Date: <strong>${dateStr}</strong></span>
                        </div>
                    </div>
                `;
            });
        }

        function openPayModal(id) {
            const c = creditRecords.find(x => x.id === id);
            if (!c) return;

            document.getElementById('payCustId').value = c.id;
            document.getElementById('payInvRef').value = c.ref;
            document.getElementById('payCustName').value = c.name;
            document.getElementById('payCurrentDebt').value = 'Rs. ' + c.debt.toLocaleString('en-US', {minimumFractionDigits:2});
            document.getElementById('payDate').valueAsDate = new Date();
            document.getElementById('payAmount').value = c.debt;
            document.getElementById('payNotes').value = '';
            document.getElementById('payModal').style.display = 'flex';
        }

        function saveCreditPayment(e) {
            e.preventDefault();
            const id = document.getElementById('payCustId').value;
            const amount = parseFloat(document.getElementById('payAmount').value) || 0;
            const date = document.getElementById('payDate').value;
            const method = document.getElementById('payMethod').value;
            const notes = document.getElementById('payNotes').value.trim();

            const cIdx = creditRecords.findIndex(x => x.id === id);
            if (cIdx >= 0) {
                creditRecords[cIdx].debt = Math.max(0, creditRecords[cIdx].debt - amount);
            }

            // Record Income Entry in Finance Ledger!
            const bizId = getBizId();
            const finKey = `autocare_finance_${bizId}`;
            let finEntries = localStorage.getItem(finKey) ? JSON.parse(localStorage.getItem(finKey)) : [];

            const finEntry = {
                id: 'FIN-SETTLE-' + Date.now(),
                date: date,
                ref: document.getElementById('payInvRef').value || 'SETTLE',
                cat: 'Customer Credit Settlement',
                desc: `Credit Settlement from ${document.getElementById('payCustName').value} (${notes || method})`,
                type: 'INCOME',
                amount: amount
            };

            finEntries.unshift(finEntry);
            localStorage.setItem(finKey, JSON.stringify(finEntries));

            if (window.AutoCareUtils) {
                window.AutoCareUtils.saveFinanceFirestore(finEntry);
                window.AutoCareUtils.postToGL(bizId, {
                    id: 'GL-SETTLE-' + finEntry.id,
                    date: date,
                    refDocId: finEntry.ref,
                    memo: finEntry.desc,
                    totalDebit: amount,
                    totalCredit: amount,
                    entries: [
                        { accountCode: (method === 'BANK' ? '1-1020' : '1-1010'), accountName: (method === 'BANK' ? 'Bank Account' : 'Cash Account'), debit: amount, credit: 0 },
                        { accountCode: '1-1030', accountName: 'Accounts Receivable (Customer Debtors)', debit: 0, credit: amount }
                    ]
                });
            }

            document.getElementById('payModal').style.display = 'none';
            renderCreditCards();
            alert(`✅ Credit Payment of Rs. ${amount.toLocaleString()} collected successfully!\nFinancial Income Ledger & Platform GL updated.`);
        }

        window.onload = loadCreditData;
    </script>
</body>
</html>

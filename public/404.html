<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIGIBIZ SYSTEM — Redirecting...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #064e3b;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 32px 24px;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: #f59e0b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h2 { margin: 0 0 10px; font-size: 20px; }
        p { color: #cbd5e1; font-size: 14px; margin: 0 0 20px; }
        a {
            display: inline-block;
            background: #f59e0b;
            color: #064e3b;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner"></div>
        <h2>Loading DIGIBIZ Portal...</h2>
        <p>Connecting to your application...</p>
        <a id="directLink" href="/clients/madawalateashop">Open App</a>
    </div>

    <script>
        const path = window.location.pathname.toLowerCase();
        let target = '/clients/madawalateashop';

        if (path.includes('chisathi')) {
            target = '/clients/chisathifamily';
        } else if (path.includes('sathi')) {
            target = '/clients/sathityrecentre';
        } else if (path.includes('thusitha')) {
            target = '/clients/thusithajayasundara';
        } else if (path.includes('spi')) {
            target = '/clients/spi_holdings';
        } else if (path.includes('delight')) {
            target = '/clients/delightbakers';
        } else if (path.includes('madawala') || path.includes('darshana')) {
            target = '/clients/madawalateashop';
        }

        document.getElementById('directLink').href = target;
        setTimeout(() => {
            window.location.replace(target);
        }, 300);
    </script>
</body>
</html>

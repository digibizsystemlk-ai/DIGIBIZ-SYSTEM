<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card with Gold Rim -->
  <rect width="192" height="192" rx="44" fill="url(#bgGrad)"/>
  <rect x="5" y="5" width="182" height="182" rx="39" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.6"/>

  <!-- Steaming Tea Cup & Leaves Emblem -->
  <g transform="translate(96, 85)">
    <!-- Steam Curves -->
    <path d="M-18 -45 C-14 -35, -22 -28, -18 -18" fill="none" stroke="#6ee7b7" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <path d="M0 -50 C4 -38, -4 -30, 0 -18" fill="none" stroke="#fde68a" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
    <path d="M18 -45 C22 -35, 14 -28, 18 -18" fill="none" stroke="#6ee7b7" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

    <!-- Tea Leaves Behind Cup -->
    <path d="M0 -15 C-25 -40, -40 -10, 0 0 C40 -10, 25 -40, 0 -15 Z" fill="url(#leafGrad)" opacity="0.95" filter="url(#glow)"/>
    <path d="M0 -15 L0 0" stroke="#047857" stroke-width="2"/>

    <!-- Tea Cup Body -->
    <path d="M-36 0 C-34 26, 34 26, 36 0 Z" fill="url(#goldGrad)" />
    <!-- Tea Cup Rim Inner -->
    <ellipse cx="0" cy="0" rx="36" ry="8" fill="#78350f" />
    <ellipse cx="0" cy="0" rx="32" ry="6" fill="#047857" />

    <!-- Cup Handle -->
    <path d="M34 4 C48 4, 48 18, 30 20" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>

    <!-- Cup Saucer -->
    <ellipse cx="0" cy="27" rx="46" ry="6" fill="url(#goldGrad)"/>
    <ellipse cx="0" cy="26" rx="42" ry="4" fill="#064e3b"/>
  </g>

  <!-- Typography -->
  <text x="96" y="148" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13.5" font-weight="900" fill="#fef3c7" text-anchor="middle" letter-spacing="1.2">MADAWALA</text>
  <text x="96" y="166" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#34d399" text-anchor="middle" letter-spacing="3">TEA SHOP</text>
</svg>